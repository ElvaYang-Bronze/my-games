<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <title>拍照识字 · 智能 OCR</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <style>
    :root{--ink:#172039;--muted:#7d8394;--blue:#5267e9;--blue2:#6d7df0;--line:#e9ebf2;--paper:#fff;--bg:#f7f8fc;--shadow:0 18px 45px rgba(47,55,100,.12)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit}.app{min-height:100dvh;max-width:480px;margin:auto;background:var(--bg);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;padding:19px 20px 12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#5369ed,#8c96f6);display:grid;place-items:center;box-shadow:0 9px 20px #586bea42}.logo svg{width:22px;color:white}.brand strong{display:block;font-size:18px;letter-spacing:.02em}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px;letter-spacing:.08em}.round{border:0;background:#fff;width:39px;height:39px;border-radius:50%;display:grid;place-items:center;color:#5f6577;box-shadow:0 4px 16px #27305912;cursor:pointer}.round svg{width:20px}
    main{padding:5px 20px}.hero{text-align:center;padding:17px 0 20px}.hero h1{font-size:25px;margin:0 0 8px;letter-spacing:.04em}.hero p{margin:0;color:var(--muted);font-size:13px}
    .scanner{position:relative;height:331px;border-radius:25px;overflow:hidden;background:linear-gradient(155deg,#dce0e9,#f0f1f5 57%,#d8dce7);box-shadow:var(--shadow)}.preview,.camera{width:100%;height:100%;object-fit:cover;display:none}.scanner.has-image .preview,.scanner.camera-on .camera{display:block}.scanner.camera-on .placeholder,.scanner.has-image .placeholder{display:none}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#9198aa}.placeholder svg{width:52px;margin-bottom:13px;opacity:.65}.placeholder b{font-size:14px}.placeholder small{font-size:11px;margin-top:6px}
    .corner{position:absolute;width:37px;height:37px;border-color:white;border-style:solid;filter:drop-shadow(0 1px 3px #2225);pointer-events:none}.c1{left:18px;top:18px;border-width:3px 0 0 3px;border-radius:8px 0 0}.c2{right:18px;top:18px;border-width:3px 3px 0 0;border-radius:0 8px 0 0}.c3{left:18px;bottom:18px;border-width:0 0 3px 3px;border-radius:0 0 0 8px}.c4{right:18px;bottom:18px;border-width:0 3px 3px 0;border-radius:0 0 8px}.focus-ring{display:none;position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 1px #5369ed,0 2px 12px #202a6666;pointer-events:none}.focus-ring.show{display:block;animation:focus .65s ease-out}.focus-ring::before,.focus-ring::after{content:"";position:absolute;background:#fff}.focus-ring::before{width:12px;height:2px;left:21px;top:26px}.focus-ring::after{width:2px;height:12px;left:26px;top:21px}@keyframes focus{from{transform:scale(1.4);opacity:.35}to{transform:scale(1);opacity:1}}.scanline{display:none;position:absolute;left:20px;right:20px;top:18%;height:2px;background:linear-gradient(90deg,transparent,#8fa0ff,#fff,#8fa0ff,transparent);box-shadow:0 0 12px #8295ff;animation:scan 2s ease-in-out infinite}.scanning .scanline{display:block}@keyframes scan{50%{top:82%}}
    .corner{position:absolute;width:37px;height:37px;border-color:white;border-style:solid;filter:drop-shadow(0 1px 3px #2225);pointer-events:none}.c1{left:18px;top:18px;border-width:3px 0 0 3px;border-radius:8px 0 0}.c2{right:18px;top:18px;border-width:3px 3px 0 0;border-radius:0 8px 0 0}.c3{left:18px;bottom:18px;border-width:0 0 3px 3px;border-radius:0 0 0 8px}.c4{right:18px;bottom:18px;border-width:0 3px 3px 0;border-radius:0 0 8px}.scanline{display:none;position:absolute;left:20px;right:20px;top:18%;height:2px;background:linear-gradient(90deg,transparent,#8fa0ff,#fff,#8fa0ff,transparent);box-shadow:0 0 12px #8295ff;animation:scan 2s ease-in-out infinite}.scanning .scanline{display:block}@keyframes scan{50%{top:82%}}
    .tip{text-align:center;color:#8b91a0;font-size:11px;margin:14px 0 17px}.actions{display:grid;grid-template-columns:1fr 1.55fr;gap:12px}.btn{height:53px;border:0;border-radius:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.btn svg{width:19px}.secondary{background:#fff;color:#596071;box-shadow:0 6px 20px #28305f10}.primary{color:white;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 9px 22px #5369ed4d}.btn:active{transform:scale(.98)}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px}.section-title b{font-size:15px}.section-title button{border:0;background:none;color:#959aa8;font-size:11px;cursor:pointer}.results{background:#fff;border-radius:20px;min-height:105px;padding:17px 18px;box-shadow:0 8px 28px #3540690d}.empty{display:flex;align-items:center;gap:12px;color:#a0a5b2;font-size:12px;height:71px}.empty-icon{width:42px;height:42px;border-radius:13px;background:#f1f3fb;display:grid;place-items:center;color:#8994d6}.empty-icon svg{width:20px}.result-top{display:flex;justify-content:space-between;color:#8a90a0;font-size:11px;margin-bottom:11px}.result-text{font-size:14px;line-height:1.75;white-space:pre-wrap;max-height:160px;overflow:auto}.tools{display:flex;gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.tool{border:0;border-radius:10px;background:#f2f4fc;color:#5867bd;padding:8px 12px;font-size:11px;cursor:pointer}.progress{height:4px;background:#e8ebf8;border-radius:4px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:var(--blue);transition:width .25s}.status{font-size:11px;color:#6f7690;margin-top:9px}
    nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:73px;padding-bottom:env(safe-area-inset-bottom);background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid #eceef4;display:flex;justify-content:space-around;align-items:center}.navitem{border:0;background:none;color:#a0a5b3;font-size:10px;display:grid;justify-items:center;gap:4px;cursor:pointer}.navitem svg{width:21px}.navitem.active{color:var(--blue)}input{display:none}.toast{position:fixed;z-index:20;left:50%;bottom:92px;transform:translate(-50%,15px);padding:10px 16px;color:white;background:#20263be8;border-radius:11px;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:600px){body{padding:24px}.app{min-height:calc(100dvh - 48px);border-radius:28px;box-shadow:0 25px 70px #2c35521a;overflow:hidden}nav{bottom:24px;border-radius:0 0 28px 28px}.scanner{height:345px}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2M7 8h10M7 12h7M7 16h9"/></svg></div><div><strong>拍照识字</strong><span>SMART OCR</span></div></div><button class="round" id="more" aria-label="更多选项"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></header>
  <main>
    <section class="hero"><h1>扫描并提取文字</h1><p>拍摄文档，或从相册中选择图片</p></section>
    <div class="scanner" id="scanner"><div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 16 5-5 4 4 2-2 7 6M16.5 9h.01"/></svg><b>将文档放在画面中</b><small>支持 JPG、PNG 与手机拍摄</small></div><video class="camera" id="camera" playsinline autoplay muted></video><img class="preview" id="preview" alt="待识别图片"><div class="focus-ring" id="focusRing"></div><div class="scanline"></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i></div>
    <p class="tip" id="tip">请确保图片清晰、光线充足，并尽量避免倾斜</p>
    <div class="scanner" id="scanner"><div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 16 5-5 4 4 2-2 7 6M16.5 9h.01"/></svg><b>将文档放在画面中</b><small>支持 JPG、PNG 与手机拍摄</small></div><video class="camera" id="camera" playsinline autoplay muted></video><img class="preview" id="preview" alt="待识别图片"><div class="scanline"></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i></div>
    <p class="tip">请确保图片清晰、光线充足，并尽量避免倾斜</p>
    <div class="actions"><button class="btn secondary" id="album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/></svg>相册</button><button class="btn primary" id="shoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 5 13 3h-2L9.5 5H6a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3z"/><circle cx="12" cy="13" r="4"/></svg><span>开始拍摄</span></button></div>
    <input id="file" type="file" accept="image/*">
    <div class="section-title"><b>识别结果</b><button id="clear">清空</button></div><section class="results" id="results"><div class="empty"><span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>识别后的文字将显示在这里</div></section>
  </main>
  <nav><button class="navitem active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3M8 9h8M8 13h8M8 17h5"/></svg>扫描</button><button class="navitem" id="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>历史</button><button class="navitem" id="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>设置</button></nav><div class="toast" id="toast"></div>
</div>
<script>
  const $=s=>document.querySelector(s), scanner=$('#scanner'), video=$('#camera'), preview=$('#preview'), file=$('#file'), results=$('#results'), shoot=$('#shoot');
  let stream=null,currentImage='';
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
  function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}scanner.classList.remove('camera-on');shoot.querySelector('span').textContent='开始拍摄'}
  function showImage(src){stopCamera();currentImage=src;preview.src=src;scanner.classList.add('has-image');recognize()}
  $('#album').onclick=()=>file.click(); file.onchange=e=>{const f=e.target.files[0];if(f)showImage(URL.createObjectURL(f))};
  shoot.onclick=async()=>{if(stream){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);showImage(c.toDataURL('image/jpeg',.96));return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();await enableAutofocus();scanner.classList.remove('has-image');scanner.classList.add('camera-on');shoot.querySelector('span').textContent='拍下并识别';$('#tip').textContent='已开启连续自动对焦 · 点击画面可对焦文字'}catch(e){file.setAttribute('capture','environment');file.click();toast('无法打开相机，请选择照片')}};
  async function enableAutofocus(){const track=stream.getVideoTracks()[0],caps=track.getCapabilities?.()||{};if(caps.focusMode?.includes('continuous')){try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}}}
  scanner.addEventListener('pointerup',async e=>{if(!stream)return;const rect=scanner.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,ring=$('#focusRing');ring.style.left=x+'px';ring.style.top=y+'px';ring.classList.remove('show');void ring.offsetWidth;ring.classList.add('show');setTimeout(()=>ring.classList.remove('show'),900);const track=stream.getVideoTracks()[0],caps=track.getCapabilities?.()||{};try{if(caps.focusMode?.includes('single-shot'))await track.applyConstraints({advanced:[{focusMode:'single-shot',pointsOfInterest:[{x:x/rect.width,y:y/rect.height}]}]});else await enableAutofocus();toast('正在对焦…')}catch(err){toast('当前设备仅支持自动对焦')}});
  shoot.onclick=async()=>{if(stream){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);showImage(c.toDataURL('image/jpeg',.92));return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;scanner.classList.remove('has-image');scanner.classList.add('camera-on');shoot.querySelector('span').textContent='拍下并识别'}catch(e){file.setAttribute('capture','environment');file.click();toast('无法打开相机，请选择照片')}};
  async function recognize(){scanner.classList.add('scanning');results.innerHTML='<div class="result-top"><span>正在分析图片…</span><span id="percent">0%</span></div><div class="progress"><div class="bar"></div></div><div class="status">首次识别需加载语言模型，请稍候</div>';
    if(!window.Tesseract){scanner.classList.remove('scanning');results.innerHTML='<div class="empty">识别组件加载失败，请检查网络后重试</div>';return}
    try{const out=await Tesseract.recognize(currentImage,'chi_sim+eng',{logger:m=>{if(m.progress){const p=Math.round(m.progress*100),bar=$('.bar'),pc=$('#percent');if(bar)bar.style.width=p+'%';if(pc)pc.textContent=p+'%'}}});renderResult(out.data.text.trim()||'未识别到文字，请换一张更清晰的图片。')}catch(e){results.innerHTML='<div class="empty">识别失败，请检查网络或更换图片重试</div>'}finally{scanner.classList.remove('scanning')}}
  function renderResult(text){results.innerHTML='<div class="result-top"><span>识别完成</span><span>'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'</span></div><div class="result-text"></div><div class="tools"><button class="tool" id="copy">复制文字</button><button class="tool" id="download">导出 TXT</button></div>';$('.result-text').textContent=text;$('#copy').onclick=()=>navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板'));$('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='识别结果.txt';a.click()};localStorage.setItem('ocr-last',text)}
  $('#clear').onclick=()=>{stopCamera();currentImage='';preview.removeAttribute('src');scanner.classList.remove('has-image','scanning');results.innerHTML='<div class="empty"><span class="empty-icon">▤</span>识别后的文字将显示在这里</div>';file.value=''};
  $('#history').onclick=()=>{const text=localStorage.getItem('ocr-last');text?(renderResult(text),toast('已显示最近一次识别')):toast('还没有识别记录')};['#settings','#more'].forEach(id=>$(id).onclick=()=>toast('更多功能正在准备中'));
</script>
</body>
</html>
